name: Automated API Tests

# حدد متى يتم تشغيل الاختبارات تلقائياً
on:
  push:
    branches: [ "main", "master" ] # أو اسم الفرع الأساسي لديك
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل الاختبارات يدوياً من زر في موقع GitHub

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود الخاص بالمشروع
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة بايثون
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. تثبيت المكتبات المطلوبة (pytest, requests, jsonschema)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests jsonschema

    
    - name: Run Pytest
      run: |
        python -m pytest -v